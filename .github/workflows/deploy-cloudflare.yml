# Deploys this copy of SignuDoc to Cloudflare: builds the app into a
# container image and publishes it with the Worker in cloudflare/ (see
# wrangler.jsonc).
#
# Runs after the CI workflow passes on the production branch, so a change
# that fails its tests is never deployed. It can also be started by hand.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   a token that may edit Workers and Containers
#   CLOUDFLARE_ACCOUNT_ID  the account to deploy to
# The app's own settings and secrets live on the Worker, not here. See
# cloudflare/README.md.

name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the image and deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # A copy that deploys another way, such as one made with the Deploy to
      # Cloudflare button (Cloudflare builds those itself), has no token
      # here. The run then passes without doing anything.
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed from GitHub."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # The runner's own Docker builds the image. Wrangler pushes it to
      # Cloudflare's registry and rolls the container over to it.
      - if: env.HAS_TOKEN == 'true'
        run: npm ci --no-audit --no-fund
      - if: env.HAS_TOKEN == 'true'
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
